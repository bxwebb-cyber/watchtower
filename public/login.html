<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Dunn</title>
<link rel="stylesheet" href="watchtower.css">
<style>
  /* Show/hide password (kept from the 9/27 login page — designer to fold into watchtower.css) */
  .wt-password-wrap { position: relative; display: block; }
  .wt-password-wrap .wt-input { width: 100%; padding-right: 44px; }
  .wt-password-toggle { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 10px; color: #8A7A55; display: flex; align-items: center; justify-content: center; }
  .wt-password-toggle:hover { color: #0F302E; }
  .wt-password-toggle svg { width: 18px; height: 18px; display: block; }
</style>
</head>
<body>
<!--
  /login: one page that flips between Sign in and Create account.
  Mode: /login → Sign in. /login?plan=solo|business or /login?mode=signup → Create account.
        Landing "Get started" should link to /login?mode=signup; "Sign in" to /login.
  Plan: keep ?plan= through signup. The plan strip shows only when plan is set.
        solo → "Up to 5 clients · $39 a month" · business → "Unlimited clients · $59 a month" (?billing=yearly → $390 / $540 a year)
  Submit fires wt:auth { mode, data } with FormData as an object:
        signin: email, password · signup: owner_name, business_name, email, password, plan
  Errors: fill .wt-auth__error and unhide it.
  After signup → onboarding (connect Stripe). After sign in → /dashboard. A plan → Stripe checkout.
  The API side lives in login.js (engineering).
-->
<div class="wt-auth">
  <aside class="wt-auth__side">
    <a class="wt-auth__brand" href="/"><img src="lighthouse-transparent.png" alt="">Dunn</a>
    <p class="wt-auth__quote">We keep watch, <em>so you don't have to.</em></p>
    <p class="wt-auth__foot">Reminders, follow-ups and the late fee you agreed on.</p>
  </aside>

  <main class="wt-auth__main">
    <div class="wt-auth__panel">
      <h1 class="wt-auth__title" data-mode-text="Welcome back.|Start watching.">Welcome back.</h1>
      <p class="wt-auth__sub" data-mode-text="Sign in to your Dunn account.|Create your account. Connecting Stripe comes next.">Sign in to your Dunn account.</p>

      <form class="wt-auth__form" data-auth-form novalidate>
        <!-- Plan picker (sign-up only): pick or change a plan without leaving the page. -->
        <fieldset class="wt-planpick" data-plan-picker hidden>
          <div class="wt-planpick__head">
            <legend>Your plan</legend>
            <div class="wt-planpick__toggle" role="group" aria-label="Billing period">
              <button type="button" data-billing="monthly">Monthly</button>
              <button type="button" data-billing="yearly">Yearly <em>save up to 24%</em></button>
            </div>
          </div>
          <label class="wt-planpick__opt"><input type="radio" name="plan_choice" value="solo"><span class="wt-planpick__name">Up to 5 clients<small>Billed as often as weekly</small></span><span class="wt-planpick__price" data-price="solo">$39 a month</span></label>
          <label class="wt-planpick__opt"><input type="radio" name="plan_choice" value="business"><span class="wt-planpick__name">Unlimited clients<small>No cap</small></span><span class="wt-planpick__price" data-price="business">$59 a month</span></label>
        </fieldset>
        <input type="hidden" name="plan" value="">
        <div class="wt-auth__error" role="alert" hidden></div>

        <label class="wt-field" data-signup-only hidden>Your name<input class="wt-input" name="owner_name" autocomplete="name" placeholder="Marta Rivera"></label>
        <label class="wt-field" data-signup-only hidden>Business name<input class="wt-input" name="business_name" autocomplete="organization" placeholder="Rivera Studio">
          <span class="wt-helper">The name your clients know you by. It's what they'll see in every email.</span></label>
        <label class="wt-field">Email<input class="wt-input" name="email" type="email" autocomplete="email" placeholder="you@business.com" required></label>
        <label class="wt-field">Password
          <span class="wt-password-wrap">
            <input class="wt-input" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="wt-password-toggle" data-password-toggle aria-label="Show password" tabindex="-1">
              <svg class="ico-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="ico-eye-off" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </span>
          <span class="wt-helper" data-signup-only hidden>At least 12 characters, with an uppercase letter, a lowercase letter and a number.</span>
        </label>
        <!-- Password reset isn't built yet — the link stays hidden until /login/forgot exists (engineering 9/28). -->
        <a class="wt-auth__forgot" href="/login/forgot" hidden>Forgot password?</a>

        <button class="wt-btn wt-btn--primary" type="submit" data-mode-text="Sign in|Create account">Sign in</button>
        <span class="wt-helper" data-signup-only hidden style="text-align:center">By creating an account you agree to the <a href="/terms" target="_blank">Terms</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</span>
      </form>

      <p class="wt-auth__switch">
        <span data-signin-only>New to Dunn? <button type="button" data-set-mode="signup">Create an account</button></span>
        <span data-signup-only hidden>Already have an account? <button type="button" data-set-mode="signin">Sign in</button></span>
      </p>
    </div>
  </main>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var plan = q.get('plan');
  var billing = q.get('billing') === 'yearly' ? 'yearly' : 'monthly';
  var PRICES = { monthly: { solo: '$39 a month', business: '$59 a month' }, yearly: { solo: '$390 a year', business: '$540 a year' } };
  var form = document.querySelector('[data-auth-form]');
  var mode = (plan || q.get('mode') === 'signup') ? 'signup' : 'signin';
  // The picker writes its choice into the URL (?plan=…&billing=…), which is
  // what login.js reads when it starts checkout after sign-up.
  function renderPlan() {
    if (plan !== 'solo' && plan !== 'business') plan = null;
    form.plan.value = plan || '';
    form.querySelectorAll('[name="plan_choice"]').forEach(function (r) { r.checked = r.value === plan; r.closest('label').classList.toggle('is-selected', r.checked); });
    form.querySelectorAll('[data-billing]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.billing === billing)); });
    form.querySelectorAll('[data-price]').forEach(function (el) { el.textContent = PRICES[billing][el.dataset.price]; });
    var u = new URLSearchParams(location.search);
    if (plan) u.set('plan', plan); else u.delete('plan');
    if (billing === 'yearly') u.set('billing', 'yearly'); else u.delete('billing');
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  }
  form.querySelectorAll('[name="plan_choice"]').forEach(function (r) { r.addEventListener('change', function () { plan = r.value; renderPlan(); }); });
  form.querySelectorAll('[data-billing]').forEach(function (b) { b.addEventListener('click', function () { billing = b.dataset.billing; renderPlan(); }); });
  renderPlan();
  function setMode(m) {
    mode = m;
    var up = m === 'signup';
    document.querySelectorAll('[data-signup-only]').forEach(function (el) { el.hidden = !up; });
    document.querySelectorAll('[data-signin-only]').forEach(function (el) { el.hidden = up; });
    document.querySelector('[data-plan-picker]').hidden = !up;
    document.querySelectorAll('[data-mode-text]').forEach(function (el) { el.textContent = el.dataset.modeText.split('|')[up ? 1 : 0]; });
    form.owner_name.required = form.business_name.required = up;
    form.password.autocomplete = up ? 'new-password' : 'current-password';
    document.title = (up ? 'Create account' : 'Sign in') + ' · Dunn';
  }
  document.querySelectorAll('[data-set-mode]').forEach(function (b) { b.addEventListener('click', function () { setMode(b.dataset.setMode); }); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = Object.fromEntries(new FormData(form).entries());
    if (mode === 'signin') { delete data.owner_name; delete data.business_name; delete data.plan; }
    document.dispatchEvent(new CustomEvent('wt:auth', { detail: { mode: mode, data: data } }));
  });
  setMode(mode);
})();
</script>
<script src="login.js"></script>
</body>
</html>
