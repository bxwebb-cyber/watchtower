<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunn · Watch</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0f0a;
    color: #e4e8e4;
    padding: 12px;
    min-height: 100vh;
  }
  .conn-status {
    text-align: center;
    padding: 8px;
    font-size: 11px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .conn-status--ok { background: #0d1f0d; color: #6ae8a0; }
  .conn-status--err { background: #1f0d0d; color: #e86a6a; }
  .conn-status--wait { background: #1a1a0d; color: #e8b26a; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: #141914;
    border: 1px solid #1f261f;
    border-radius: 10px;
    padding: 14px;
    cursor: default;
  }
  .card--clickable { cursor: pointer; transition: background 0.15s; }
  .card--clickable:hover { background: #1a211a; }
  .card__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card__label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #7a887a;
  }
  .card__value {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
  }
  .card__sub {
    font-size: 11px;
    color: #7a887a;
    margin-top: 2px;
  }
  .card--danger .card__value { color: #e86a6a; }
  .card--ok .card__value { color: #6ae8a0; }
  .card--warn .card__value { color: #e8b26a; }
  .card--neutral .card__value { color: #e4e8e4; }
  .card--accent { border-color: #6ae8a0; }
  .details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #1f261f; }
  .details.open { display: block; }
  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; font-size: 12px; border-bottom: 1px solid #1a1f1a;
  }
  .detail-row .amount { color: #e86a6a; }
  .detail-row .days { color: #7a887a; font-size: 10px; }
  .settings { margin-top: 16px; padding-top: 12px; border-top: 1px solid #1f261f; }
  .settings label { display: block; font-size: 10px; color: #7a887a; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .settings input {
    width: 100%; padding: 8px 10px; margin-bottom: 6px;
    background: #141914; border: 1px solid #1f261f; border-radius: 6px;
    color: #e4e8e4; font-size: 12px;
  }
  .settings input:focus { outline: none; border-color: #6ae8a0; }
  .settings .row { display: flex; gap: 6px; align-items: flex-end; }
  .settings .row input:first-child { flex: 1; }
  .settings button {
    padding: 8px 16px; white-space: nowrap;
    background: #6ae8a0; color: #0a0f0a; border: none; border-radius: 6px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .settings button:hover { background: #58d68c; }
  .badge { display: inline-block; background: #e86a6a; color: #fff; border-radius: 99px; padding: 1px 6px; font-size: 10px; font-weight: 600; margin-left: 6px; }
  .loading { text-align: center; padding: 40px; color: #7a887a; font-size: 13px; }
</style>
</head>
<body>
  <div id="app">
    <div class="settings" id="settings-form">
      <label>Dunn server URL</label>
      <div class="row">
        <input id="server-url" type="text" placeholder="https://getdunn.org" value="">
        <button id="save-settings">Save</button>
      </div>
      <label style="margin-top:6px">API token</label>
      <input id="api-token" type="password" placeholder="your API token">
    </div>
    <div id="status-bar"></div>
    <div id="cards-container"><div class="loading">No data yet — enter your server URL above.</div></div>
  </div>
<script src="sidepanel.js"></script>
</body>
</html>
